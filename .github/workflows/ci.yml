name: CI

on:
  push:
    branches: [main]
  pull_request:

# Aynı dala arka arkaya commit atıldığında ESKİ turlar iptal edilir.
# Şef oturumları bir dilimde 5-8 commit atıyor; bu blok olmadan her biri tam
# turu (test ~17-19 dk + alembic-cycle) sonuna kadar koşuyordu — hâlbuki yalnız
# EN SON commit'in sonucu anlamlı. Kapsam kaybı YOK.
# `main` HARİÇ TUTULUR (`github.run_id` benzersiz olduğu için grup çakışmaz):
# main'e inen tur, migration canlıda kendiliğinden koşacağı için ASLA yarıda
# kesilmemelidir.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Debian (glibc) imajı: alpine (musl) en_US.utf8'i BAYT sırasıyla harmanlar
        # ("Tuğla" < "Çimento"); yerel fiil-pg16 ve üretim glibc dil sırasıdır.
        # ORDER BY name içeren golden'lar alpine'de sahte-kırmızı olur (#148).
        image: postgres:16
        env:
          POSTGRES_USER: fiil
          POSTGRES_PASSWORD: fiil
          POSTGRES_DB: fiil_erp_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://fiil:fiil@localhost:5433/fiil_erp_test
      DATABASE_URL: postgresql+asyncpg://fiil:fiil@localhost:5433/fiil_erp_test
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 🔴 KURULUM KİLİTTEN YAPILIR (TB-LOCK, 2026-08-25). `pip install -e ".[dev]"`
      # aralıkları HER TURDA yeniden çözerdi: kapılar, canlının koştuğundan farklı bir
      # ağaçla yeşil verebiliyordu. `--no-deps` şart — onsuz pip projeyi kurarken
      # aralıkları tekrar çözer ve kilidi ezer.
      - run: pip install -r requirements-dev.lock
      - run: pip install -e . --no-deps
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      # 🔴 PARALEL KOŞU (TB-XDIST, 2026-08-25). Tek çekirdekte bu adım **24 dk 24 sn**
      # sürüyordu (PR #80 turu, 6144 test) ve turun tamamına hükmediyordu.
      # `-n` AÇIK verilir, `auto` DEĞİL: runner çekirdek sayısı sessizce değişebilir ve
      # kapının süresi/davranışı ölçülmemiş bir sayıya bağlanır.
      # `--dist loadfile`: aynı dosyanın testleri aynı işçiye gider — dosya bütününde
      # koşmaya dayanan bekçiler (eşzamanlılık testleri, FAT-1 dersi) bölünmez.
      # Yalıtım: her işçi KENDİ veritabanını alır (`tests/conftest.py` →
      # `PYTEST_XDIST_WORKER` son eki); paylaşılan tek DB'de koşmak sahte kırmızı VE
      # sahte yeşil üretirdi.
      # 🔴 `--cov-fail-under=80` KORUNUR: pytest-cov, xdist işçilerinin ölçümlerini
      # denetleyicide BİRLEŞTİRİR; eşik birleşik rapor üzerinden uygulanır.
      - run: python -m pytest -n 4 --dist loadfile --cov=app --cov-report=term-missing --cov-fail-under=80

  alembic-cycle:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Debian (glibc) imajı: alpine (musl) en_US.utf8'i BAYT sırasıyla harmanlar
        # ("Tuğla" < "Çimento"); yerel fiil-pg16 ve üretim glibc dil sırasıdır.
        # ORDER BY name içeren golden'lar alpine'de sahte-kırmızı olur (#148).
        image: postgres:16
        env:
          POSTGRES_USER: fiil
          POSTGRES_PASSWORD: fiil
          POSTGRES_DB: fiil_erp_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://fiil:fiil@localhost:5433/fiil_erp_test
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 🔴 KURULUM KİLİTTEN YAPILIR (TB-LOCK, 2026-08-25). `pip install -e ".[dev]"`
      # aralıkları HER TURDA yeniden çözerdi: kapılar, canlının koştuğundan farklı bir
      # ağaçla yeşil verebiliyordu. `--no-deps` şart — onsuz pip projeyi kurarken
      # aralıkları tekrar çözer ve kilidi ezer.
      - run: pip install -r requirements-dev.lock
      - run: pip install -e . --no-deps
      - run: alembic upgrade head
      - run: alembic downgrade -1
      - run: alembic upgrade head

  # 🔴 ÜRETİM KİLİDİ KAPISI (PROD-LOCK, 2026-08-30). Bu iş, ölçülmüş bir CANLI
  # ÇÖKÜŞÜN ardından eklendi ve kusurun sınıfını kapatır.
  #
  # OLAY: AI-0b `app/modules/ai/registry.py`ye MODÜL DÜZEYİNDE `import httpx` koydu.
  # `main.py` → `core/router_registry.py` → `ai/router.py` zinciriyle bu import
  # AÇILIŞTA çalışır. `httpx` o güne kadar yalnız `[project.optional-dependencies]
  # dev` bloğundaydı (backend'de HİÇ giden HTTP çağrısı yoktu, httpx testlerin
  # `ASGITransport`u içindi) ve `requirements.lock`ta YOKTU.
  #
  # SONUÇ: üretim imajı `ModuleNotFoundError: No module named 'httpx'` ile açıldı,
  # `uvicorn` HİÇ başlamadı, canlı backend 502 verdi — DÖRT KAPININ DÖRDÜ DE YEŞİLKEN.
  #
  # SEBEP YAPISALDI: `test` ve `alembic-cycle` işlerinin ikisi de
  # `requirements-dev.lock` kurar (httpx VAR); `Dockerfile` ise `requirements.lock`
  # kurar (httpx YOKTU). Yani CI, canlının fiilen kurduğu ağacı HİÇ SINAMIYORDU.
  # Bu iş tam olarak o boşluğu kapatır: Docker'ın kurduğu kilidi kurar ve
  # uvicorn'un yaptığı ŞEYİ yapar — `app.main`i import eder.
  #
  # 🔴 `--no-deps` ve `-e .` KULLANILMAZ: amaç projeyi kurmak değil, imajın
  # ağacını BİREBİR yeniden üretmektir. Dockerfile da `pip install -e .` koşmaz;
  # uygulama koduna `WORKDIR` üzerinden erişilir, bu iş de `PYTHONPATH=.` ile aynısını yapar.
  prod-lock-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade pip && pip install -r requirements.lock
      # DB'ye BAĞLANMAZ: `app.main` import'u motoru kurar ama bağlantı AÇMAZ
      # (`create_async_engine` tembeldir). Sahte bir DSN yeterlidir ve bu bilinçlidir —
      # iş bir PG servisi istemez, böylece kapı hızlı ve kırılgansız kalır.
      - name: uvicorn'un yaptigini yap - app.main'i import et
        env:
          DATABASE_URL: postgresql+asyncpg://ci:ci@127.0.0.1:5432/ci
          JWT_SECRET: ci-secret
          PYTHONPATH: .
        run: python -c "from app.main import app; print('app.main OK, rota ogesi:', len(app.routes))"
